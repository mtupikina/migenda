name: Deploy production

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  deploy-api:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      WEB_ORIGIN: ${{ secrets.WEB_ORIGIN }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      MIGENDA_GITHUB_CLIENT_ID: ${{ secrets.MIGENDA_GITHUB_CLIENT_ID }}
      MIGENDA_GITHUB_CLIENT_SECRET: ${{ secrets.MIGENDA_GITHUB_CLIENT_SECRET }}
    steps:
      - name: Sync env from GitHub Secrets to Render
        run: |
          set -euo pipefail
          upsert() {
            key="$1"
            value="$2"
            body="$(jq -nc --arg value "$value" '{value:$value}')"
            curl -fsS -X PUT \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/${key}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              --data "$body"
          }
          upsert NODE_ENV production
          upsert MONGODB_URI "$MONGODB_URI"
          upsert WEB_ORIGIN "$WEB_ORIGIN"
          upsert BREVO_API_KEY "$BREVO_API_KEY"
          upsert EMAIL_FROM "$EMAIL_FROM"
          upsert GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          upsert GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          upsert GITHUB_CLIENT_ID "$MIGENDA_GITHUB_CLIENT_ID"
          upsert GITHUB_CLIENT_SECRET "$MIGENDA_GITHUB_CLIENT_SECRET"

      - name: Deploy Render
        run: |
          curl -fsS -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}'

  deploy-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Use repo Vercel build settings
        run: |
          node -e '
            const fs = require("fs");
            const file = ".vercel/project.json";
            const project = JSON.parse(fs.readFileSync(file, "utf8"));
            const key = project.settings ? "settings" : "projectSettings";
            project[key] = project[key] ?? {};
            project[key].outputDirectory = "dist";
            project[key].rootDirectory = null;
            project[key].buildCommand =
              "pnpm --filter @migenda/shared build && pnpm --filter @migenda/web build";
            fs.writeFileSync(file, JSON.stringify(project, null, 2));
          '
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
